<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử - Cashback System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Ensure desktop/mobile views work correctly */
        @media (max-width: 768px) {
            .desktop-only {
                display: none !important;
            }
            .mobile-only {
                display: block !important;
            }
        }

        @media (min-width: 769px) {
            .mobile-only {
                display: none !important;
            }
            .desktop-only {
                display: block !important;
            }

            /* Desktop table styling */
            .table-container {
                overflow-x: auto;
                margin-bottom: 20px;
            }

            .data-table {
                width: 100%;
                min-width: 900px;
            }

            .data-table th,
            .data-table td {
                padding: 12px;
                text-align: left;
                white-space: nowrap;
            }

            /* Merchant column with logo */
            .merchant-cell {
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 150px;
            }

            .merchant-mini-logo {
                width: 24px;
                height: 24px;
                object-fit: contain;
                border-radius: 4px;
            }

            /* Highlight important columns */
            .data-table td.highlight {
                font-weight: 600;
                color: #10b981;
            }

            /* Status badges */
            .status-badge {
                padding: 4px 12px;
                border-radius: 12px;
                font-size: 0.85rem;
                font-weight: 500;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" id="mobileMenuToggle">☰</button>

    <div class="app-container">
        <!-- Sidebar will be loaded by user-sidebar.js -->

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-wrapper">
                <div class="content-header">
                    <h1>Lịch sử giao dịch</h1>
                    <div class="user-info">
                        <span id="userName">User</span>
                    </div>
                </div>

                <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="conversions">Đơn hàng</button>
                <button class="tab-btn" data-tab="clicks">Lượt click</button>
            </div>

            <!-- Conversions Tab -->
            <div class="tab-content active" id="conversionsTab">
                <div class="filter-bar">
                    <div class="filter-group">
                        <label for="statusFilter">Trạng thái:</label>
                        <select id="statusFilter" class="filter-select">
                            <option value="">Tất cả</option>
                            <option value="approved">Đã duyệt</option>
                            <option value="pending">Chờ duyệt</option>
                            <option value="rejected">Từ chối</option>
                        </select>
                    </div>
                </div>

                <!-- Desktop Table View -->
                <div class="table-container desktop-only">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Merchant</th>
                                <th>Mã đơn</th>
                                <th>Giá trị đơn</th>
                                <th>Cashback</th>
                                <th>TT Đơn hàng</th>
                                <th>TT Đối soát</th>
                                <th>Thời gian đặt</th>
                                <th>Thời gian duyệt</th>
                            </tr>
                        </thead>
                        <tbody id="conversionsTable">
                            <tr class="loading-state">
                                <td colspan="8">
                                    <div class="loading">Đang tải...</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Mobile Card View -->
                <div class="mobile-only">
                    <div id="conversionsCards" class="cards-container">
                        <div class="loading">Đang tải...</div>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="pagination" id="conversionsPagination">
                    <div class="rows-per-page">
                        <label for="conversionsRowsPerPage">Hiển thị:</label>
                        <select id="conversionsRowsPerPage">
                            <option value="10">10</option>
                            <option value="20" selected>20</option>
                            <option value="50">50</option>
                        </select>
                    </div>
                    <button class="btn-secondary" id="prevConversions" disabled>« Trước</button>
                    <span id="conversionsPageInfo">Trang 1</span>
                    <button class="btn-secondary" id="nextConversions">Sau »</button>
                </div>
            </div>

            <!-- Clicks Tab -->
            <div class="tab-content" id="clicksTab">
                <!-- Desktop Table View -->
                <div class="table-container desktop-only">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Merchant</th>
                                <th>Loại</th>
                                <th>Thời gian click</th>
                                <th>Có mua hàng?</th>
                                <th>Trạng thái</th>
                                <th>Cashback</th>
                                <th>Link</th>
                            </tr>
                        </thead>
                        <tbody id="clicksTable">
                            <tr class="loading-state">
                                <td colspan="7">
                                    <div class="loading">Đang tải...</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Mobile Card View -->
                <div class="mobile-only">
                    <div id="clicksCards" class="cards-container">
                        <div class="loading">Đang tải...</div>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="pagination" id="clicksPagination">
                    <div class="rows-per-page">
                        <label for="clicksRowsPerPage">Hiển thị:</label>
                        <select id="clicksRowsPerPage">
                            <option value="10">10</option>
                            <option value="20" selected>20</option>
                            <option value="50">50</option>
                        </select>
                    </div>
                    <button class="btn-secondary" id="prevClicks" disabled>« Trước</button>
                    <span id="clicksPageInfo">Trang 1</span>
                    <button class="btn-secondary" id="nextClicks">Sau »</button>
                </div>
            </div>
            </div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/user-sidebar.js"></script>
    <script src="js/mobile-menu.js"></script>
    <script src="js/history.js"></script>
</body>
</html>
