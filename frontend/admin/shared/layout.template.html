<!--
    Shared Admin Layout Template

    Usage: Copy this template when creating new admin pages
    Replace {{PAGE_TITLE}}, {{PAGE_ICON}}, {{ACTIVE_NAV}}, {{CONTENT}}
-->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PAGE_TITLE}} - Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="admin.css">
    <!-- Add page-specific styles here -->
    <style>
        /* Page-specific CSS */
    </style>
</head>
<body>
    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" id="mobileMenuToggle">☰</button>

    <div class="app-container">
        <!-- Sidebar - Include from shared/sidebar.html -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">Admin</span>
            </div>

            <nav class="nav">
                <a href="/admin" class="nav-item {{ACTIVE_dashboard}}">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">Dashboard</span>
                </a>
                <a href="/admin/users" class="nav-item {{ACTIVE_users}}">
                    <span class="nav-icon">👥</span>
                    <span class="nav-text">Users</span>
                </a>
                <a href="/admin/conversions" class="nav-item {{ACTIVE_conversions}}">
                    <span class="nav-icon">💰</span>
                    <span class="nav-text">Conversions</span>
                </a>
                <a href="/admin/at-orders" class="nav-item {{ACTIVE_at-orders}}">
                    <span class="nav-icon">📦</span>
                    <span class="nav-text">Dữ liệu đơn AT</span>
                </a>
                <a href="/admin/reconciliation" class="nav-item {{ACTIVE_reconciliation}}">
                    <span class="nav-icon">📋</span>
                    <span class="nav-text">Đối soát</span>
                </a>
                <a href="/admin/merchants" class="nav-item {{ACTIVE_merchants}}">
                    <span class="nav-icon">🏪</span>
                    <span class="nav-text">Merchants</span>
                </a>
                <a href="/admin/tools" class="nav-item {{ACTIVE_tools}}">
                    <span class="nav-icon">🔧</span>
                    <span class="nav-text">Tools</span>
                </a>
                <a href="#" class="nav-item" id="logoutBtn">
                    <span class="nav-icon">🚪</span>
                    <span class="nav-text">Logout</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header">
                <h1>{{PAGE_ICON}} {{PAGE_TITLE}}</h1>
                <div class="user-info">
                    <span id="userName">Admin</span>
                </div>
            </div>

            <!-- Page Content -->
            {{CONTENT}}

        </main>
    </div>

    <!-- Shared Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/mobile-menu.js"></script>
    <script src="shared/utils.js"></script>

    <!-- Page-specific script -->
    <script src="{{PAGE_SCRIPT}}"></script>
</body>
</html>
