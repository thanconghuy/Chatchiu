<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversions Management - Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">Admin</span>
            </div>

            <nav class="nav">
                <a href="/admin" class="nav-item">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">Dashboard</span>
                </a>
                <a href="/admin/users" class="nav-item">
                    <span class="nav-icon">👥</span>
                    <span class="nav-text">Users</span>
                </a>
                <a href="/admin/conversions" class="nav-item active">
                    <span class="nav-icon">💰</span>
                    <span class="nav-text">Conversions</span>
                </a>
                <a href="/admin/merchants" class="nav-item">
                    <span class="nav-icon">🏪</span>
                    <span class="nav-text">Merchants</span>
                </a>
                <a href="/admin/tools" class="nav-item">
                    <span class="nav-icon">🔧</span>
                    <span class="nav-text">Tools</span>
                </a>
                <a href="/dashboard" class="nav-item">
                    <span class="nav-icon">👤</span>
                    <span class="nav-text">User View</span>
                </a>
                <a href="#" class="nav-item" id="logoutBtn">
                    <span class="nav-icon">🚪</span>
                    <span class="nav-text">Logout</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header">
                <h1>Conversions Management</h1>
                <div class="user-info">
                    <span id="userName">Admin</span>
                </div>
            </div>

            <!-- Filter Bar -->
            <div class="filter-bar">
                <div class="filter-group">
                    <label for="statusFilter">Status:</label>
                    <select id="statusFilter" class="filter-select">
                        <option value="">All</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
            </div>

            <!-- Conversions Table -->
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Merchant</th>
                            <th>Order Code</th>
                            <th>Order Amount</th>
                            <th>Commission</th>
                            <th>Cashback</th>
                            <th>Status</th>
                            <th>Order Time</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="conversionsTable">
                        <tr class="loading-state">
                            <td colspan="9">
                                <div class="loading">Loading...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <button class="btn-secondary" id="prevBtn" disabled>« Previous</button>
                <span id="pageInfo">Page 1</span>
                <button class="btn-secondary" id="nextBtn">Next »</button>
            </div>
        </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="conversions.js"></script>
</body>
</html>
