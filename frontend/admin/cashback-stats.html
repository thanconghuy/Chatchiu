<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashback Stats - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/admin/admin.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .search-bar {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 24px;
        }

        .search-bar::before {
            display: none !important;
        }

        .search-row {
            display: flex;
            gap: 16px;
            align-items: flex-end;
            justify-content: center;
        }

        .search-filters {
            display: grid;
            grid-template-columns: 200px 200px 180px 180px;
            gap: 16px;
            align-items: end;
        }

        .search-input-group {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .search-input-group label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #374151;
            margin-bottom: 6px;
            display: block;
            height: 20px;
            line-height: 20px;
        }

        .search-input-group input,
        .search-input-group select {
            height: 42px;
            padding: 0 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
            box-sizing: border-box;
            margin: 0;
        }

        .search-button-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 68px;
        }

        .search-input-group input:focus,
        .search-input-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn-search {
            padding: 0 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            height: 42px;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 1200px) {
            .search-filters {
                grid-template-columns: 1fr 1fr;
            }

            .search-row {
                flex-direction: column;
                align-items: stretch;
            }

            .search-button-wrapper {
                justify-content: flex-end;
            }
        }

        @media (max-width: 768px) {
            .search-filters {
                grid-template-columns: 1fr;
            }

            .btn-search {
                width: 100%;
            }
        }

        /* Override stat-card for cashback stats page */
        .stats-grid .stat-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .stats-grid .stat-card h3 {
            margin: 0 0 12px 0;
            font-size: 0.95rem;
            color: #666;
            font-weight: 600;
        }

        .stats-grid .stat-card .stat-value {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            color: #333;
        }
    </style>
</head>
<body>
    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Sidebar - Rendered by sidebar.js -->
    <div id="sidebarContainer"></div>

    <div class="app-container">
        <main class="main-content">
            <!-- Header -->
            <div class="page-header">
                <h1>📈 Thống Kê Cashback Của User</h1>
                <p style="padding-top: 10px; padding-bottom: 10px;">Xem tổng quan cashback và đơn hàng của từng user trong khoảng thời gian</p>
            </div>

            <!-- Date Range Filter -->
            <div class="search-bar">
                <div class="search-row">
                    <div class="search-filters">
                        <div class="search-input-group" id="customDateGroup">
                            <label for="fromDate">📅 Từ ngày:</label>
                            <input type="date" id="fromDate" class="input-field">
                        </div>
                        <div class="search-input-group" id="customDateGroupTo">
                            <label for="toDate">📅 Đến ngày:</label>
                            <input type="date" id="toDate" class="input-field">
                        </div>
                        <div class="search-input-group">
                            <label for="timeRangeSelect">⏱️ Nhanh:</label>
                            <select id="timeRangeSelect" class="input-field">
                                <option value="custom">Tùy chọn</option>
                                <option value="30days">30 ngày gần nhất</option>
                                <option value="thismonth">Tháng này</option>
                                <option value="lastmonth">Tháng trước</option>
                                <option value="90days">90 ngày qua</option>
                            </select>
                        </div>
                        <div class="search-input-group">
                            <label for="sortBy">🔄 Sắp xếp:</label>
                            <select id="sortBy" class="input-field">
                                <option value="cashback_desc">Cashback giảm dần</option>
                                <option value="orders_desc">Số đơn giảm dần</option>
                                <option value="username_asc">Username A-Z</option>
                            </select>
                        </div>
                    </div>
                    <div class="search-button-wrapper">
                        <button class="btn-search" id="applyFilterBtn">Áp dụng</button>
                    </div>
                </div>
            </div>

            <!-- Stats Summary Cards -->
            <div class="stats-grid" style="margin-bottom: 24px;">
                <div class="stat-card">
                    <h3>Tổng Users</h3>
                    <p class="stat-value" id="totalUsersCount">-</p>
                </div>
                <div class="stat-card">
                    <h3>Tổng Đơn Hàng</h3>
                    <p class="stat-value" id="totalOrdersCount">-</p>
                </div>
                <div class="stat-card">
                    <h3>Tổng Giá Trị</h3>
                    <p class="stat-value" id="totalOrderValue">-</p>
                </div>
                <div class="stat-card">
                    <h3>Tổng Cashback</h3>
                    <p class="stat-value" id="totalCashback">-</p>
                </div>
            </div>

            <!-- Table Section -->
            <div class="table-section">
                <div class="table-header">
                    <h2>Danh Sách User</h2>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Họ Tên</th>
                                <th>Tổng Đơn</th>
                                <th>Tổng Giá Trị</th>
                                <th>Cashback</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="statsTableBody">
                            <tr>
                                <td colspan="7" class="loading-cell">
                                    <div class="loading-spinner"></div>
                                    Đang tải...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="pagination" id="pagination" style="display: none; margin-top: 20px; justify-content: space-between; align-items: center; gap: 12px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label for="limitSelect" style="color: #666; font-size: 0.9rem; font-weight: 500;">Hiển thị:</label>
                        <select id="limitSelect" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem;">
                            <option value="10">10</option>
                            <option value="20" selected>20</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <button class="btn-secondary" id="prevBtn" disabled style="padding: 8px 16px;">« Trước</button>
                        <span id="pageInfo" style="color: #666; font-weight: 500;">Trang 1</span>
                        <button class="btn-secondary" id="nextBtn" style="padding: 8px 16px;">Sau »</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-content" style="max-width: 600px; padding: 30px; position: relative;">
            <span class="close-modal" id="closeModal" style="position: absolute; top: 20px; right: 20px; font-size: 2rem; color: #666; cursor: pointer; background: none; border: none; line-height: 1;">&times;</span>
            <h2 style="margin-top: 0;">Chi Tiết Cashback</h2>
            <div id="modalContent"></div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/admin/sidebar.js"></script>
    <script src="/admin/js/cashback-stats.js"></script>
</body>
</html>
