<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Management - Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" id="mobileMenuToggle">☰</button>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">Admin</span>
            </div>

            <nav class="nav">
                <a href="/admin" class="nav-item">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">Dashboard</span>
                </a>
                <a href="/admin/users" class="nav-item active">
                    <span class="nav-icon">👥</span>
                    <span class="nav-text">Users</span>
                </a>
                <a href="/admin/conversions" class="nav-item">
                    <span class="nav-icon">💰</span>
                    <span class="nav-text">Conversions</span>
                </a>
                <a href="/admin/at-orders" class="nav-item">
                    <span class="nav-icon">📦</span>
                    <span class="nav-text">Dữ liệu đơn AT</span>
                </a>
                <a href="/admin/reconciliation" class="nav-item">
                    <span class="nav-icon">📋</span>
                    <span class="nav-text">Đối soát</span>
                </a>
                <a href="/admin/merchants" class="nav-item">
                    <span class="nav-icon">🏪</span>
                    <span class="nav-text">Merchants</span>
                </a>
                <a href="/admin/tools" class="nav-item">
                    <span class="nav-icon">🔧</span>
                    <span class="nav-text">Tools</span>
                </a>
                <a href="#" class="nav-item" id="logoutBtn">
                    <span class="nav-icon">🚪</span>
                    <span class="nav-text">Logout</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-wrapper">
                <div class="content-header">
                    <h1>Users Management</h1>
                    <div class="user-info">
                        <span id="userName">Admin</span>
                    </div>
                </div>

                <!-- Search Bar -->
            <div class="search-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm theo email, username, hoặc tên...">
                <button class="search-btn" id="searchBtn">🔍 Tìm kiếm</button>
            </div>

            <!-- Users Table -->
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Họ tên</th>
                            <th>Điện thoại</th>
                            <th>Số dư khả dụng</th>
                            <th>Số dư chờ xử lý</th>
                            <th>Tổng clicks</th>
                            <th>Tổng conversions</th>
                            <th>Ngày tạo</th>
                        </tr>
                    </thead>
                    <tbody id="usersTable">
                        <!-- Initial skeleton rows -->
                        <tr class="skeleton-row">
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                        </tr>
                        <tr class="skeleton-row">
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                        </tr>
                        <tr class="skeleton-row">
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                            <td><div class="skeleton skeleton-text"></div></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <div class="rows-per-page">
                    <label for="rowsPerPage">Hiển thị:</label>
                    <select id="rowsPerPage">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="50" selected>50</option>
                        <option value="100">100</option>
                    </select>
                </div>
                <button class="btn-secondary" id="prevBtn" disabled>« Trước</button>
                <span id="pageInfo">1</span>
                <button class="btn-secondary" id="nextBtn">Sau »</button>
            </div>
            </div>
        </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/mobile-menu.js"></script>
    <script src="users.js"></script>
</body>
</html>
