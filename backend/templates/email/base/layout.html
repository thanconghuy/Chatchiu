<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{subject}}</title>
  <style>
    /* Email client compatibility styles */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, Arial, sans-serif;
      line-height: 1.6;
      color: #333333;
      background-color: #f4f4f4;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    img {
      border: 0;
      height: auto;
      line-height: 100%;
      outline: none;
      text-decoration: none;
      max-width: 100%;
    }

    /* Container */
    .email-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
    }

    /* Header */
    .email-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
      padding: 40px 30px;
      text-align: center;
    }

    .email-header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
    }

    .email-header p {
      margin: 10px 0 0 0;
      font-size: 16px;
      opacity: 0.9;
    }

    /* Content */
    .email-content {
      padding: 40px 30px;
      font-size: 16px;
      color: #333333;
    }

    .email-content h2 {
      color: #1e293b;
      font-size: 24px;
      margin: 0 0 20px 0;
      font-weight: 600;
    }

    .email-content p {
      margin: 0 0 16px 0;
      color: #475569;
    }

    /* Info Box */
    .info-box {
      background: #f0f7ff;
      border-left: 4px solid #667eea;
      padding: 20px;
      margin: 25px 0;
      border-radius: 6px;
    }

    .info-box h3 {
      margin: 0 0 12px 0;
      color: #1e40af;
      font-size: 18px;
      font-weight: 600;
    }

    .info-box p {
      margin: 8px 0;
      color: #1e293b;
    }

    .info-box strong {
      color: #0f172a;
      font-weight: 600;
    }

    /* Amount Highlight */
    .amount-highlight {
      text-align: center;
      padding: 30px 20px;
      margin: 30px 0;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      border-radius: 12px;
      border: 2px solid #67eea;
    }

    .amount-highlight .label {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .amount-highlight .amount {
      font-size: 42px;
      font-weight: 800;
      color: #667eea;
      margin: 0;
      line-height: 1.2;
    }

    /* Button */
    .button-container {
      text-align: center;
      margin: 30px 0;
    }

    .button {
      display: inline-block;
      padding: 16px 40px;
      background: #667eea;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      transition: background 0.3s ease;
    }

    .button:hover {
      background: #5568d3;
    }

    .button-success {
      background: #10b981;
    }

    .button-success:hover {
      background: #059669;
    }

    /* Timeline */
    .timeline {
      margin: 30px 0;
      padding: 20px;
      background: #f9fafb;
      border-radius: 8px;
    }

    .timeline-item {
      display: flex;
      align-items: center;
      margin: 12px 0;
      padding: 8px 0;
    }

    .timeline-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      font-size: 16px;
    }

    .timeline-icon.completed {
      background: #10b981;
      color: #ffffff;
    }

    .timeline-icon.current {
      background: #667eea;
      color: #ffffff;
    }

    .timeline-text {
      flex: 1;
      color: #475569;
    }

    .timeline-text.completed {
      color: #10b981;
      font-weight: 600;
    }

    /* Warning/Alert Box */
    .warning-box {
      background: #fef3c7;
      border-left: 4px solid #f59e0b;
      padding: 20px;
      margin: 25px 0;
      border-radius: 6px;
    }

    .warning-box p {
      margin: 0;
      color: #92400e;
    }

    .danger-box {
      background: #fee2e2;
      border-left: 4px solid #ef4444;
      padding: 20px;
      margin: 25px 0;
      border-radius: 6px;
    }

    .danger-box p {
      margin: 0;
      color: #991b1b;
    }

    .success-box {
      background: #d1fae5;
      border-left: 4px solid #10b981;
      padding: 20px;
      margin: 25px 0;
      border-radius: 6px;
    }

    .success-box p {
      margin: 0;
      color: #065f46;
    }

    /* Footer */
    .email-footer {
      background: #f9fafb;
      padding: 30px;
      text-align: center;
      border-top: 1px solid #e5e7eb;
    }

    .email-footer p {
      margin: 8px 0;
      font-size: 14px;
      color: #6b7280;
    }

    .email-footer strong {
      color: #374151;
      font-weight: 600;
    }

    .email-footer a {
      color: #667eea;
      text-decoration: none;
    }

    .email-footer a:hover {
      text-decoration: underline;
    }

    .footer-links {
      margin: 15px 0;
    }

    .footer-links a {
      display: inline-block;
      margin: 0 10px;
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
    }

    .footer-disclaimer {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.5;
    }

    /* Responsive */
    @media only screen and (max-width: 600px) {
      .email-container {
        width: 100% !important;
      }

      .email-header,
      .email-content,
      .email-footer {
        padding: 25px 20px !important;
      }

      .email-header h1 {
        font-size: 24px !important;
      }

      .amount-highlight .amount {
        font-size: 32px !important;
      }

      .button {
        padding: 14px 30px !important;
        font-size: 15px !important;
      }
    }
  </style>
</head>
<body>
  <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0">
    <tr>
      <td align="center" style="padding: 20px 0;">
        <table class="email-container" role="presentation" border="0" cellspacing="0" cellpadding="0">
          <!-- Header -->
          <tr>
            <td class="email-header">
              {{header}}
            </td>
          </tr>

          <!-- Content -->
          <tr>
            <td class="email-content">
              {{content}}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td class="email-footer">
              {{footer}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
